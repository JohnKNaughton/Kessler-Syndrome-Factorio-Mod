[entity-name]
scrap-asteroid=Scrapsteroid
medium-scrap-asteroid=Medium Scrapsteroid

[entity-description]
scrap-asteroid=Centuries of accumulated industrial debris compressed into a drifting hazard. Glows faintly green from radioactive contamination.
medium-scrap-asteroid=A larger mass of compressed orbital debris. Yields more scrap chunks than its smaller counterpart and glows with the same eerie radioactive green.

[mod-setting-name]
kessler-syndrome-spawn-multiplier=Scrapsteroid Spawn Rate Multiplier

[mod-setting-description]
kessler-syndrome-spawn-multiplier=Multiplies the spawn rate of all Scrapsteroids. Default 1.0 = standard rate. Increase for more chaos, decrease for a calmer experience.

[item-name]
scrap-asteroid-chunk=Scrapsteroid Chunk

[item-description]
scrap-asteroid-chunk=Compacted orbital debris recovered from a Scrapsteroid. Crush it to extract scrap metal. With care, radioactive components can also be recovered — including depleted fuel cells and trace fissile material.

[asteroid-chunk-name]
scrap-asteroid-chunk=Scrapsteroid Chunk

[asteroid-chunk-description]
scrap-asteroid-chunk=Compacted orbital debris recovered from a Scrapsteroid. Crush it to extract scrap metal. With care, radioactive components can also be recovered — including depleted fuel cells and trace fissile material.

[recipe-name]
scrap-asteroid-chunk-basic=Basic Scrapsteroid Processing
scrap-asteroid-chunk-advanced=Geiger Scrapsteroid Processing

[recipe-description]
scrap-asteroid-chunk-basic=Crush scrap asteroid debris into raw scrap metal.
scrap-asteroid-chunk-advanced=Careful processing of radioactive debris yields scrap, with a chance of depleted uranium fuel cells and a rare chance of nuclear fuel.
